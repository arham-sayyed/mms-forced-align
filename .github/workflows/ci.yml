name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache downloaded ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/mms-forced-align
          key: mms-model-v1
          restore-keys: |
            mms-model-

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
